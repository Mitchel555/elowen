# Dependency update policy. Security updates are enabled at the repository level and run regardless of
# this file; what is configured here is the routine VERSION updates on top of them.
#
# Routine version updates are OFF: `open-pull-requests-limit: 0` stops them for an ecosystem without
# touching security updates, which keep arriving. The routine stream was producing about fifteen pull
# requests a week — majors that need a deliberate migration, and minors with no security content — and
# reviewing that volume crowded out the updates that actually matter. Security fixes are taken as they
# come; the rest is done on purpose, in its own change, with the full gate run behind it.
#
# The grouping below is kept deliberately: it is the recipe for re-enabling the routine stream. Raise a
# limit above zero and a week's drift arrives grouped, as a handful of reviewable pull requests rather
# than one per package.
version: 2
updates:
  # ── Daemon / CLI / plugins ────────────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      # The PI packages are pinned to an EXACT version on purpose: they ship breaking changes in patch
      # releases, and they must move in lockstep or the agent runtime fails to start. Grouping them keeps
      # that lockstep — one pull request carrying all three, with CI proving the bump before it lands.
      # They are deliberately NOT ignored: an ignore rule here would also suppress their SECURITY updates.
      pi-runtime:
        patterns:
          - "@earendil-works/*"
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@earendil-works/*"
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

  # ── Next.js web app ───────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

  # ── Workflow actions ──────────────────────────────────────────────────────────────────────────────
  # Left on: actions are referenced by major tag, so this only surfaces a genuine major bump — rare, and
  # the only automated signal that the CI supply chain has moved. It produced none of the noise above.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
